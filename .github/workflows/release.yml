name: Release

on:
  push:
    tags:
      - "v0.1.55"
  workflow_call:
    inputs:
      tag_name:
        description: "Exact internal release tag"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Exact internal release tag"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  prepare-release:
    name: Bind immutable release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag_commit: ${{ steps.metadata.outputs.tag_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify exact tag, version, and peeled commit
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test "${RELEASE_TAG}" = "v0.1.55" || {
            echo "::error::Only the approved v0.1.55 internal release is permitted"
            exit 1
          }
          workspace_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "${workspace_version}" = "0.1.55" || {
            echo "::error::Workspace version is ${workspace_version}, expected 0.1.55"
            exit 1
          }
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")"
          test "${head_commit}" = "${tag_commit}" || {
            echo "::error::Checked-out commit does not equal the peeled tag commit"
            exit 1
          }
          echo "version=${workspace_version}" >> "$GITHUB_OUTPUT"
          echo "tag_commit=${tag_commit}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: aioncore
            archive_kind: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: aioncore.exe
            archive_kind: zip
            rustflags: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Fix MSVC linker resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -ErrorAction SilentlyContinue

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: internal-v0.1.55-${{ matrix.target }}-${{ matrix.os }}

      - name: Verify migration lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migration/generate-lineage.py \
            --migrations crates/aionui-db/migrations \
            --check migration-lineage.json

      - name: Capture tool versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            rustc --version --verbose
            cargo --version
            python3 --version
            node --version
            uname -a || true
          } > evidence/tool-versions.txt 2>&1

      - name: Build native release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            test -f "/c/Strawberry/perl/bin/perl.exe" || {
              echo "::error::Strawberry Perl is required for the Windows OpenSSL build"
              exit 1
            }
            export OPENSSL_SRC_PERL="C:/Strawberry/perl/bin/perl.exe"
          fi
          cargo build --locked --release --target "${{ matrix.target }}" -p aionui-app \
            2>&1 | tee evidence/build.log

      - name: Prepare complete managed resources
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          test -f "${binary}"
          "${binary}" \
            --data-dir "${PWD}/work/release-data" \
            prepare-managed-resources \
            --bundle-out "${PWD}/work/managed-resources" \
            2>&1 | tee evidence/prepare-managed-resources.log

      - name: Add pinned OfficeCLI to managed resources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/prepare_officecli.py \
            --managed-resources work/managed-resources \
            --target "${{ matrix.target }}" \
            2>&1 | tee evidence/prepare-officecli.log

      - name: Assemble and verify complete bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.tag_commit }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          built_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/release/assemble_bundle.py \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
            --lineage migration-lineage.json \
            --managed-resources work/managed-resources \
            --output work/bundle \
            --repository khoapnt-vng/aioncore \
            --version "${VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --target "${{ matrix.target }}" \
            --built-at "${built_at}"
          {
            echo "verify assembled bundle"
            python3 scripts/release/verify_bundle.py \
              --bundle work/bundle \
              --repository khoapnt-vng/aioncore \
              --version "${VERSION}" \
              --source-commit "${SOURCE_COMMIT}" \
              --target "${{ matrix.target }}"
          } 2>&1 | tee evidence/verify-assembled.log

      - name: Archive bundle on macOS
        if: matrix.archive_kind == 'tar'
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="aioncore-v${VERSION}-${{ matrix.target }}.tar.gz"
          test ! -e "dist/${ARCHIVE}"
          tar -C work/bundle -czf "dist/${ARCHIVE}" .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Archive bundle on Windows
        if: matrix.archive_kind == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $archive = "aioncore-v${env:VERSION}-${{ matrix.target }}.zip"
          if (Test-Path "dist/${archive}") { throw "archive already exists: ${archive}" }
          Compress-Archive -Path "work/bundle/*" -DestinationPath "dist/${archive}"
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Extract archived bundle on macOS
        if: matrix.archive_kind == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          mkdir work/extracted
          tar -xzf "dist/${ARCHIVE}" -C work/extracted

      - name: Extract archived bundle on Windows
        if: matrix.archive_kind == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/extracted | Out-Null
          Expand-Archive -Path "dist/${env:ARCHIVE}" -DestinationPath work/extracted

      - name: Verify freshly extracted archive
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.tag_commit }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "verify freshly extracted archive"
            python3 scripts/release/verify_bundle.py \
              --bundle work/extracted \
              --repository khoapnt-vng/aioncore \
              --version "${VERSION}" \
              --source-commit "${SOURCE_COMMIT}" \
              --target "${{ matrix.target }}"
          } 2>&1 | tee evidence/verify-extracted.log

      - name: Upload immutable release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-${{ matrix.target }}
          path: |
            work/bundle/bundle-manifest.json
            work/bundle/SHA256SUMS
            work/extracted/bundle-manifest.json
            evidence/build.log
            evidence/prepare-managed-resources.log
            evidence/prepare-officecli.log
            evidence/verify-assembled.log
            evidence/verify-extracted.log
            evidence/tool-versions.txt
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Create immutable unsigned GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build
    steps:
      - name: Download only final archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Validate archive set and generate checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          test -f "artifacts/aioncore-v${VERSION}-aarch64-apple-darwin.tar.gz"
          test -f "artifacts/aioncore-v${VERSION}-x86_64-pc-windows-msvc.zip"
          archive_count="$(find artifacts -maxdepth 1 -type f -name 'aioncore-*' | wc -l | tr -d ' ')"
          test "${archive_count}" = "2"
          test ! -e artifacts/aioncore-checksums.txt
          (
            cd artifacts
            sha256sum \
              "aioncore-v${VERSION}-aarch64-apple-darwin.tar.gz" \
              "aioncore-v${VERSION}-x86_64-pc-windows-msvc.zip" \
              > aioncore-checksums.txt
          )

      - name: Fail if the release already exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists; assets are immutable"
            exit 1
          fi

      - name: Create unsigned internal release once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "artifacts/aioncore-v0.1.55-aarch64-apple-darwin.tar.gz" \
            "artifacts/aioncore-v0.1.55-x86_64-pc-windows-msvc.zip" \
            "artifacts/aioncore-checksums.txt" \
            --repo "${REPOSITORY}" \
            --title "${RELEASE_TAG} internal unsigned" \
            --notes "Internal unsigned AionCore release for WePrompt Sprint 3. Manual distribution only."
