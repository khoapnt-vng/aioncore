name: "🔨 Manual Build"

on:
  push:
    tags:
      - "internal-sprint3-aioncore-*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, tag, or commit to build from"
        required: true
        default: "main"
        type: string
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options:
          - macos-arm64
          - windows-x64
          - all
        default: "macos-arm64"

permissions:
  contents: read

env:
  BINARY_NAME: aioncore
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform || 'internal-two-target' }}"

          MACOS_ARM64='{"platform":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin","binary_name":"aioncore","artifact_name":"aioncore-manual-macos-arm64"}'
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","binary_name":"aioncore.exe","artifact_name":"aioncore-manual-windows-x64","rustflags":"-C target-feature=+crt-static"}'

          if [ "$PLATFORM" = "internal-two-target" ] || [ "$PLATFORM" = "all" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64,$WINDOWS_X64]}"
          elif [ "$PLATFORM" = "macos-arm64" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64]}"
          elif [ "$PLATFORM" = "windows-x64" ]; then
            MATRIX="{\"include\":[$WINDOWS_X64]}"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Generated matrix for platform '$PLATFORM':"
          echo "$MATRIX" | python3 -m json.tool

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Configure LF checkout on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}

      - name: Get commit hash
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Commit: $SHORT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Fix MSVC linker (remove Git's link.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: manual-build-${{ matrix.target }}-${{ matrix.os }}

      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          if [[ -n "${RUSTFLAGS:-}" ]]; then
            echo "Using RUSTFLAGS=${RUSTFLAGS}"
          fi

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            test -f "/c/Strawberry/perl/bin/perl.exe" || {
              echo "::error::Strawberry Perl is required for the Windows OpenSSL build"
              exit 1
            }
            export OPENSSL_SRC_PERL="C:/Strawberry/perl/bin/perl.exe"
          fi

          cargo build --release --target ${{ matrix.target }} -p aionui-app

      - name: Prepare complete internal-test bundle
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          test -f "${binary}"
          python3 scripts/migration/generate-lineage.py \
            --migrations crates/aionui-db/migrations \
            --check migration-lineage.json
          "${binary}" \
            --data-dir "${PWD}/work/release-data" \
            prepare-managed-resources \
            --bundle-out "${PWD}/work/managed-resources"
          python3 scripts/release/prepare_officecli.py \
            --managed-resources work/managed-resources \
            --target "${{ matrix.target }}"
          source_commit="$(git rev-parse HEAD)"
          built_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/release/assemble_bundle.py \
            --binary "${binary}" \
            --lineage migration-lineage.json \
            --managed-resources work/managed-resources \
            --output work/bundle \
            --repository khoapnt-vng/aioncore \
            --version 0.1.55 \
            --source-commit "${source_commit}" \
            --target "${{ matrix.target }}" \
            --built-at "${built_at}"
          python3 scripts/release/verify_bundle.py \
            --bundle work/bundle \
            --repository khoapnt-vng/aioncore \
            --version 0.1.55 \
            --source-commit "${source_commit}" \
            --target "${{ matrix.target }}"

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          COMMIT_SHORT: ${{ steps.commit.outputs.short }}
        run: |
          mkdir -p dist
          ARCHIVE="aioncore-${COMMIT_SHORT}-${{ matrix.target }}.tar.gz"
          tar -C work/bundle -czf "dist/${ARCHIVE}" .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COMMIT_SHORT: ${{ steps.commit.outputs.short }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "aioncore-${env:COMMIT_SHORT}-${{ matrix.target }}.zip"
          Compress-Archive -Path "work/bundle/*" -DestinationPath "dist/${archive}" -Force
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload manual build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      - prepare-matrix
      - build
    if: always()

    steps:
      - name: Write build summary
        env:
          MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
        run: |
          PLATFORMS=$(echo "$MATRIX" | jq -r '[.include[].platform] | join(", ")')
          ARTIFACTS=$(echo "$MATRIX" | jq -r '[.include[].artifact_name] | join(", ")')

          echo "## AionCore Manual Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | \`${{ inputs.branch || github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | \`${PLATFORMS}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifacts | \`${ARTIFACTS}\` |" >> "$GITHUB_STEP_SUMMARY"
